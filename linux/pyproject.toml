[project]
name = "zikr"
version = "1.1.0"
description = "A quiet dhikr reminder for your desktop"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "../LICENSE" }

[project.scripts]
zikr = "zikr.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zikr*"]

[tool.setuptools.package-data]
zikr = ["data/*.json", "data/*.png"]
