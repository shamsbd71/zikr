name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows, Android, Website]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zikr version
      description: Shown in the menu, Settings, or the update dialog.
      placeholder: "1.10.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "macOS 15.2 on Apple Silicon / Ubuntu 24.04 GNOME / Windows 11 / Android 14 (Pixel 7)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For "reminders stopped", say how long the app had been running, your interval setting, and whether the computer slept or the phone was idle.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      render: shell
