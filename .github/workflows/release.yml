name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INSTALL: "0"
        run: ./build.sh

      - name: Zip app bundle
        run: |
          cd dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Zikr.app "Zikr-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zikr ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/Zikr-${{ steps.version.outputs.version }}.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-glib-2.0 gir1.2-notify-0.7 \
            gir1.2-ayatanaappindicator3-0.1 \
            speech-dispatcher xvfb dpkg-dev

      - name: Smoke test (headless import + construct app)
        run: |
          cd linux
          xvfb-run -a python3 -c "
          import gi
          gi.require_version('Gtk', '3.0')
          from zikr.app import ZikrApp
          from zikr.zikr_data import ALL, random_zikr
          assert len(ALL) > 0, 'zikr list is empty'
          z = random_zikr()
          assert 'arabic' in z and 'transliteration' in z and 'translation' in z
          app = ZikrApp()
          app.scheduler.stop()
          print('Smoke test OK —', len(ALL), 'zikr loaded, tray app constructed')
          "

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: linux/packaging/build_deb.sh

      - name: Validate package metadata
        run: |
          dpkg -I "dist/zikr_${{ steps.version.outputs.version }}_all.deb"
          dpkg -c "dist/zikr_${{ steps.version.outputs.version }}_all.deb"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zikr ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/zikr_${{ steps.version.outputs.version }}_all.deb
