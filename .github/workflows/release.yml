name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INSTALL: "0"
        run: ./build.sh

      - name: Zip app bundle
        run: |
          cd dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Zikr.app "Zikr-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zikr ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/Zikr-${{ steps.version.outputs.version }}.zip

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-glib-2.0 gir1.2-notify-0.7 \
            gir1.2-ayatanaappindicator3-0.1 \
            speech-dispatcher xvfb dpkg-dev

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: linux/packaging/build_deb.sh

      - name: Validate package metadata
        run: |
          dpkg -I "dist/zikr_${{ steps.version.outputs.version }}_all.deb"
          dpkg -c "dist/zikr_${{ steps.version.outputs.version }}_all.deb"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zikr ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/zikr_${{ steps.version.outputs.version }}_all.deb

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build windows/Zikr/Zikr.csproj -c Release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=${{ steps.version.outputs.version }} windows\packaging\ZikrSetup.iss

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zikr ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/ZikrSetup-${{ steps.version.outputs.version }}.exe
