name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned test build, not installed)
        env:
          VERSION: "0.0.0-test"
          INSTALL: "0"
        run: ./build.sh

      - name: Verify universal binary (arm64 + x86_64)
        run: |
          ARCHES="$(lipo -info dist/Zikr.app/Contents/MacOS/Zikr)"
          echo "$ARCHES"
          echo "$ARCHES" | grep -q "arm64" || { echo "::error::missing arm64 slice"; exit 1; }
          echo "$ARCHES" | grep -q "x86_64" || { echo "::error::missing x86_64 slice"; exit 1; }

      - name: Verify ad-hoc code signature
        run: codesign --verify --deep --strict dist/Zikr.app

      - name: Verify Info.plist essentials
        run: |
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Zikr.app/Contents/Info.plist)"
          [ "$BUNDLE_ID" = "com.abu.ZikrReminder" ] || { echo "::error::unexpected bundle id: $BUNDLE_ID"; exit 1; }
          UI_ELEMENT="$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/Zikr.app/Contents/Info.plist)"
          [ "$UI_ELEMENT" = "true" ] || { echo "::error::LSUIElement should be true (menu-bar-only app)"; exit 1; }

      - name: Launch smoke test
        run: |
          xattr -cr dist/Zikr.app
          open dist/Zikr.app
          sleep 4
          if ! pgrep -f "dist/Zikr.app/Contents/MacOS/Zikr" >/dev/null; then
            echo "::error::app did not stay running after launch"
            exit 1
          fi
          echo "app launched and is running"
          pkill -f "dist/Zikr.app/Contents/MacOS/Zikr"

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-glib-2.0 gir1.2-notify-0.7 \
            gir1.2-ayatanaappindicator3-0.1 \
            speech-dispatcher xvfb dpkg-dev

      - name: Unit tests
        run: |
          cd linux
          xvfb-run -a env XDG_CONFIG_HOME="$(mktemp -d)" python3 -m unittest discover -s tests -v

      - name: Smoke test (headless import + construct app)
        run: |
          cd linux
          xvfb-run -a python3 -c "
          import gi
          gi.require_version('Gtk', '3.0')
          from zikr.app import ZikrApp
          from zikr.zikr_data import ALL, random_zikr
          assert len(ALL) > 0, 'zikr list is empty'
          z = random_zikr()
          assert 'arabic' in z and 'transliteration' in z and 'translation' in z
          app = ZikrApp()
          app.scheduler.stop()
          print('Smoke test OK —', len(ALL), 'zikr loaded, tray app constructed')
          "

      - name: Build .deb (test version)
        env:
          VERSION: "0.0.0-test"
        run: linux/packaging/build_deb.sh

      - name: Validate package metadata
        run: |
          dpkg -I dist/zikr_0.0.0-test_all.deb
          dpkg -c dist/zikr_0.0.0-test_all.deb

  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK output
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name "*.apk")
          if [ -z "$apk" ]; then echo "::error::debug APK not found"; exit 1; fi
          size=$(stat -c%s "$apk")
          echo "Built: $apk ($size bytes)"
          if [ "$size" -lt 1000000 ]; then echo "::error::APK suspiciously small ($size bytes)"; exit 1; fi

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build windows/Zikr/Zikr.csproj -c Release -p:Version=0.0.0-test

      - name: Unit tests
        run: dotnet test windows/Zikr.Tests/Zikr.Tests.csproj -c Release --logger "console;verbosity=detailed"

      - name: Launch smoke test
        run: |
          $exe = "windows\Zikr\bin\Release\net48\Zikr.exe"
          if (-not (Test-Path $exe)) { throw "build output not found: $exe" }
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 4
          $proc = Get-Process -Name Zikr -ErrorAction SilentlyContinue
          if (-not $proc) { throw "app did not stay running after launch" }
          Write-Host "app launched and is running (pid $($proc.Id))"
          Stop-Process -Name Zikr -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (test version)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=0.0.0-test windows\packaging\ZikrSetup.iss

      - name: Verify installer output
        run: |
          $exe = "dist\ZikrSetup-0.0.0-test.exe"
          if (-not (Test-Path $exe)) { throw "installer not found: $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "installer size: $size bytes"
          if ($size -lt 100000) { throw "installer suspiciously small ($size bytes)" }
