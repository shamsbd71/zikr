<style>
  /* ------------------------------------------------------------------
     Night-prayer world. Dark is the default because the hour people
     actually reach for dhikr is a dark one; gold only reads as
     illumination when there is something to illuminate. The parchment
     world is preserved verbatim as the light theme.
     ------------------------------------------------------------------ */
  :root {
    --bg:            #0A0F0D;
    --bg-deep:       #060A09;
    --panel:         #121B17;
    --panel-raised:  #17231D;
    --ink:           #EFE6D5;
    --ink-dim:       #A6997F;
    --emerald:       #34A77F;
    --emerald-deep:  #0C3A2D;
    --emerald-bright:#47C79A;
    --gold:          #D6A63C;
    --gold-bright:   #F2D184;
    --terracotta:    #D9714F;
    --hairline:      rgba(214, 166, 60, 0.20);
    --hairline-soft: rgba(239, 230, 213, 0.10);
    --shadow:        0 18px 44px -20px rgba(0, 0, 0, 0.9);
    --shadow-lift:   0 26px 60px -22px rgba(0, 0, 0, 0.95);
    --hero-from:     #07120E;
    --hero-to:       #0D2C22;
    --glow:          rgba(52, 167, 127, 0.16);

    /* The hero and the "yes" panel stay dark in BOTH themes, so their
       foregrounds must not flip with the theme. Light mode darkens
       --gold-bright for parchment, which dropped the hero CTA to 1.21:1
       against its own label. These stay luminous either way. */
    --on-dark:            #F3EADA;
    --gold-on-dark:       #F2D184;
    --gold-on-dark-deep:  #D6A63C;
    --lattice-on-dark:    rgba(242, 209, 132, 0.17);

    --font-en: "Noto Serif", Georgia, serif;
    --font-bn: "Noto Serif Bengali", "Noto Serif", serif;
    --font-ar: "Noto Naskh Arabic", "Noto Serif", serif;
    --font-body: var(--font-en);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: dark;
  }

  html[data-theme="light"] {
    --bg:            #F7EFDC;
    --bg-deep:       #F1E6CE;
    --panel:         #FCF7EB;
    --panel-raised:  #FFFDF6;
    --ink:           #29231D;
    --ink-dim:       #6B6053;
    --emerald:       #0E6B52;
    --emerald-deep:  #093D30;
    --emerald-bright:#16855F;
    --gold:          #B8892E;
    --gold-bright:   #8A6416;
    --terracotta:    #B7472A;
    --hairline:      rgba(184, 137, 46, 0.28);
    --hairline-soft: rgba(41, 35, 29, 0.10);
    --shadow:        0 14px 34px -18px rgba(41, 35, 29, 0.34);
    --shadow-lift:   0 22px 48px -20px rgba(41, 35, 29, 0.40);
    --hero-from:     #093D30;
    --hero-to:       #16855F;
    --glow:          rgba(14, 107, 82, 0.12);

    /* The hero and the "yes" panel stay dark in BOTH themes, so their
       foregrounds must not flip with the theme. Light mode darkens
       --gold-bright for parchment, which dropped the hero CTA to 1.21:1
       against its own label. These stay luminous either way. */
    --on-dark:            #F3EADA;
    --gold-on-dark:       #F2D184;
    --gold-on-dark-deep:  #D6A63C;
    --lattice-on-dark:    rgba(242, 209, 132, 0.17);
    color-scheme: light;
  }

  html[lang="bn"] { --font-body: var(--font-bn); }
  html[lang="ar"] { --font-body: var(--font-ar); }

  * { box-sizing: border-box; }

  /* Flex containers blockify their children, which outranks the UA rule
     for [hidden] and left both play and stop icons visible at once. */
  [hidden] { display: none !important; }

  html { scroll-behavior: smooth; overflow-x: hidden; }
  body { overflow-x: clip; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background 0.5s var(--ease), color 0.5s var(--ease);
  }

  /* Browser surfaces belong to the design too. */
  ::selection { background: var(--gold); color: #10150F; }
  html[data-theme="light"] ::selection { background: var(--gold-bright); color: #FFF; }
  :focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
    border-radius: 4px;
  }
  * { scrollbar-color: var(--emerald) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb {
    background: var(--emerald-deep);
    border: 3px solid var(--bg-deep);
    border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--emerald); }

  .wrap { width: min(1100px, 100% - 48px); margin-inline: auto; }

  /* Prose links only. The hero CTAs and platform badges are anchors too,
     and a bare `a` rule outranks their own colour - in light mode that
     painted every hero control emerald on dark emerald. Excluding them
     here is what keeps that from silently coming back. */
  a:not(.btn):not(.platform-badge) { color: var(--emerald-bright); }
  html[data-theme="light"] a:not(.btn):not(.platform-badge) { color: var(--emerald); }

  /* ---------------- nav ---------------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px) saturate(1.3);
    border-bottom: 1px solid var(--hairline-soft);
  }
  .topnav {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-ui); font-weight: 700;
    letter-spacing: -0.02em; font-size: 17px;
    margin-inline-end: auto;
  }
  .brand img { border-radius: 7px; }

  .lang-switch, .theme-switch {
    display: flex; align-items: center;
    border: 1px solid var(--hairline); border-radius: 99px;
    padding: 3px; gap: 2px;
  }
  .lang-switch button, .theme-switch button {
    font-family: var(--font-ui); font-size: 12.5px; font-weight: 600;
    color: var(--ink-dim); background: none; border: 0;
    padding: 6px 12px; border-radius: 99px; cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .lang-switch button:hover, .theme-switch button:hover { color: var(--ink); }
  .lang-switch button[aria-pressed="true"],
  .theme-switch button[aria-pressed="true"] {
    background: var(--emerald-deep); color: var(--gold-bright);
  }
  html[data-theme="light"] .lang-switch button[aria-pressed="true"],
  html[data-theme="light"] .theme-switch button[aria-pressed="true"] {
    background: var(--emerald); color: #FFF8E6;
  }
  .theme-switch button { display: grid; place-items: center; padding: 6px 10px; }
  .theme-switch svg { width: 15px; height: 15px; display: block; }

  /* ---------------- hero ---------------- */
  .hero {
    position: relative; overflow: hidden;
    padding: 72px 0 96px;
    background:
      radial-gradient(120% 80% at 78% 8%, var(--glow), transparent 62%),
      linear-gradient(168deg, var(--hero-from), var(--hero-to));
    border-bottom: 1px solid var(--hairline);
  }
  /* Diamond lattice, drifting slowly. The page's ambient texture, not a
     decorative grid: it is the manuscript border this world inherited. */
  .hero::before {
    content: ""; position: absolute; inset: -60px;
    background-image:
      repeating-linear-gradient(45deg, var(--lattice-on-dark) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(-45deg, var(--lattice-on-dark) 0 1px, transparent 1px 34px);
    opacity: 0.55;
    animation: lattice-drift 48s linear infinite;
    pointer-events: none;
  }
  @keyframes lattice-drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(34px, 34px, 0); }
  }

  .hero-inner {
    position: relative; display: grid; gap: 56px;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    align-items: center;
  }
  .hero-copy { color: #F3EADA; }
  .hero h1 {
    font-size: clamp(2.2rem, 5.2vw, 3.6rem);
    line-height: 1.12; letter-spacing: -0.03em;
    margin: 0 0 18px; text-wrap: balance;
    color: #FFFDF7;
  }
  .hero .tagline {
    font-size: 1.08rem; color: rgba(243, 234, 218, 0.82);
    margin: 0 0 30px; max-width: 46ch;
  }

  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-ui); font-weight: 650; font-size: 15px;
    padding: 13px 24px; border-radius: 99px; text-decoration: none;
    transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease),
                background 0.18s ease, color 0.18s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--gold-on-dark), var(--gold-on-dark-deep));
    color: #22190A;
    box-shadow: 0 10px 26px -12px rgba(214, 166, 60, 0.85);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -12px rgba(214, 166, 60, 0.95); }
  .btn-secondary {
    background: rgba(255, 253, 247, 0.07);
    color: #F3EADA;
    border: 1px solid rgba(243, 234, 218, 0.26);
  }
  .btn-secondary:hover { background: rgba(255, 253, 247, 0.14); transform: translateY(-2px); }

  .platform-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .platform-badges-label {
    font-family: var(--font-ui); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.1em; color: rgba(243, 234, 218, 0.55);
    margin-inline-end: 4px;
  }
  .platform-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-ui); font-size: 12.5px; font-weight: 600;
    color: rgba(243, 234, 218, 0.9); text-decoration: none;
    padding: 7px 13px; border-radius: 99px;
    background: rgba(255, 253, 247, 0.06);
    border: 1px solid rgba(243, 234, 218, 0.16);
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .platform-badge:hover {
    background: rgba(255, 253, 247, 0.13);
    border-color: var(--gold-on-dark); transform: translateY(-1px);
  }
  .platform-badge svg { width: 15px; height: 15px; flex: none; }

  /* ---------------- the live card: the page performs the product ------- */
  .live {
    position: relative;
    background: linear-gradient(170deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 34px 32px 26px;
    box-shadow: var(--shadow-lift);
    text-align: center;
    min-height: 300px;
    display: flex; flex-direction: column; justify-content: center;
  }
  html[data-theme="light"] .live { background: var(--panel); }

  .live-status {
    position: absolute; top: 16px; inset-inline-start: 20px;
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-ui); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-dim);
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--emerald-bright);
    box-shadow: 0 0 0 0 var(--emerald-bright);
    animation: live-pulse 2.6s var(--ease) infinite;
  }
  @keyframes live-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(71, 199, 154, 0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(71, 199, 154, 0); }
    100% { box-shadow: 0 0 0 0 rgba(71, 199, 154, 0); }
  }

  .live-arabic {
    font-family: var(--font-ar);
    font-size: clamp(1.9rem, 4.4vw, 2.9rem);
    line-height: 1.85; color: var(--gold-bright);
    margin: 10px 0 14px; direction: rtl; unicode-bidi: isolate;
  }
  html[data-theme="light"] .live-arabic { color: var(--emerald-deep); }
  .live-translit {
    font-family: var(--font-ui); font-size: 14px; font-weight: 600;
    letter-spacing: 0.02em; color: var(--ink); margin-bottom: 6px;
  }
  .live-meaning {
    font-size: 0.97rem; color: var(--ink-dim);
    margin: 0 auto; max-width: 34ch;
  }

  /* The authored moment: each dhikr arrives out of soft focus. */
  .live-text > * {
    animation: dhikr-in 0.9s var(--ease) both;
  }
  .live-text > *:nth-child(2) { animation-delay: 0.07s; }
  .live-text > *:nth-child(3) { animation-delay: 0.13s; }
  @keyframes dhikr-in {
    from { opacity: 0; transform: translateY(9px); filter: blur(7px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }

  .live-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-top: 26px;
  }
  .play-btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--font-ui); font-size: 14px; font-weight: 650;
    padding: 11px 22px 11px 18px; border-radius: 99px; cursor: pointer;
    background: var(--emerald-deep); color: var(--gold-bright);
    border: 1px solid var(--hairline);
    transition: transform 0.18s var(--ease), background 0.18s ease, color 0.18s ease;
  }
  html[data-theme="light"] .play-btn { background: var(--emerald); color: #FFF8E6; border-color: transparent; }
  .play-btn:hover { transform: translateY(-2px); background: var(--emerald); color: #FFF8E6; }
  .play-btn svg { width: 15px; height: 15px; flex: none; }
  .play-btn[data-playing="true"] { background: var(--gold); color: #22190A; border-color: transparent; }

  .live-progress {
    height: 2px; margin-top: 20px; border-radius: 99px;
    background: var(--hairline-soft); overflow: hidden;
  }
  .live-progress span {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--emerald), var(--gold));
    transition: width 0.25s linear;
  }

  /* ---------------- sections ---------------- */
  main { padding: 84px 0 40px; }
  section { margin-bottom: 92px; }
  .section-title {
    font-size: clamp(1.5rem, 3vw, 2.05rem);
    letter-spacing: -0.025em; line-height: 1.2;
    margin: 0 0 28px; text-wrap: balance;
  }
  .section-lede { color: var(--ink-dim); max-width: 68ch; margin: -14px 0 32px; }

  /* signature panel — the page's one structural argument */
  .signature-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  .sig-col {
    border-radius: 16px; padding: 28px 26px;
    box-shadow: var(--shadow);
  }
  .sig-col.no { background: var(--panel); }
  .sig-col.yes {
    background: linear-gradient(158deg, var(--hero-from), var(--hero-to));
    color: #F3EADA;
  }
  .sig-col h3 {
    font-family: var(--font-ui); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.11em;
    margin: 0 0 18px; color: var(--ink-dim);
  }
  .sig-col.yes h3 { color: var(--gold-on-dark); }
  .sig-col.no ul { margin: 0; padding: 0; list-style: none; }
  .sig-col.no li {
    padding: 11px 0; border-bottom: 1px solid var(--hairline-soft);
    color: var(--ink-dim); text-decoration: line-through;
    text-decoration-color: var(--terracotta);
    text-decoration-thickness: 1.5px;
  }
  .sig-col.no li:last-child { border-bottom: 0; }
  .sig-yes-text { font-size: 1.32rem; line-height: 1.5; margin: 0; letter-spacing: -0.015em; }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 30px; }
  .feature h3 { font-size: 1.04rem; margin: 0 0 7px; letter-spacing: -0.015em; }
  .feature p { margin: 0; color: var(--ink-dim); font-size: 0.95rem; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; counter-reset: step; }
  .step { position: relative; padding-top: 22px; border-top: 1px solid var(--hairline); }
  .step h3 { font-size: 1.02rem; margin: 0 0 6px; letter-spacing: -0.015em; }
  .step p { margin: 0; color: var(--ink-dim); font-size: 0.95rem; }

  /* ---------------- the library ---------------- */
  .zikr-list { display: grid; gap: 10px; }
  .zikr-row {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 18px;
    background: var(--panel); border-radius: 14px;
    padding: 16px 20px;
    transition: background 0.2s ease, transform 0.2s var(--ease);
  }
  .zikr-row:hover { background: var(--panel-raised); transform: translateY(-1px); }
  .zikr-row[data-playing="true"] {
    background: var(--panel-raised);
    box-shadow: inset 0 0 0 1px var(--gold);
  }
  .row-play {
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: var(--emerald-deep); color: var(--gold-bright);
    border: 1px solid var(--hairline);
    transition: transform 0.18s var(--ease), background 0.18s ease, color 0.18s ease;
  }
  html[data-theme="light"] .row-play { background: var(--emerald); color: #FFF8E6; border-color: transparent; }
  .row-play:hover { background: var(--emerald); color: #FFF8E6; transform: scale(1.07); }
  .row-play svg { width: 14px; height: 14px; }
  .row-text { min-width: 0; }
  .row-arabic {
    font-family: var(--font-ar); font-size: 1.32rem; line-height: 1.9;
    color: var(--gold-bright);
    /* The script runs right-to-left, but the line still has to sit on
       the same edge as the transliteration under it, or the two read as
       unrelated. `start` would resolve to the right inside an rtl box. */
    direction: rtl; unicode-bidi: isolate; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  html[dir="rtl"] .row-arabic { text-align: right; }

      f1h: "يتحدث من تلقاء نفسه", f1p: "تُنطق عبارة ذكر بصوت عربي في لحظة عشوائية. أنت لا تبدأ ذلك — هو يبدأ من تلقاء نفسه.",
      f2h: "بلا عدّ، بلا قوائم", f2p: "لا شيء تنقر عليه أو تسجّله أو تضع عليه علامة. هذا ليس متتبع عادات — لا يوجد سلسلة عليك الحفاظ عليها.",
      f3h: "إشعار أو ومضة كاملة الشاشة", f3p: "اعرضه كإشعار macOS عادي، أو كومضة هادئة تملأ الشاشة ثم تتلاشى بعد المدة التي تختارها.",
      f4h: "عشوائي لا روتيني", f4p: "يظهر في لحظة غير متوقعة ضمن نطاق تحدده، فلا يتحول أبدًا إلى ضجيج خلفي تتجاهله.",
      f5h: "التشغيل عند بدء الدخول", f5p: "اختياري، باستخدام واجهة SMAppService الحديثة من Apple — بلا ملفات LaunchAgent وبلا سكربتات خلفية.",
      f6h: "خاص وخفيف", f6p: "بلا حسابات، وبلا تحليلات داخل التطبيق، وبلا أي اتصال بالشبكة إلا عند طلبك التحقق من التحديثات بنفسك. بصمة ذاكرة ضئيلة جدًا.",

      howTitle: "كيف يعمل",
      s1h: "التثبيت", s1p: "نزّل أحدث إصدار، فُك الضغط، واسحب Zikr إلى Applications.",
      s2h: "حدّد المدة مرة واحدة", s2p: "افتح الإعدادات من أيقونة شريط القوائم واختر كم مرة تريد أن تُذكَّر.",
      s3h: "انسَ الأمر", s3p: "هذا آخر ما تفعله. من هنا فصاعدًا، يختار Zikr الوقت، وينطق العبارة، وينسحب من طريقك.",

      sampleTitle: "نموذج مما يقوله",
      m1: "تنزيه الله عن كل نقص", m2: "كل الثناء والشكر لله", m3: "لا أحد أعظم من الله", m4: "لا معبود بحق إلا الله",
      sampleNote: "بالإضافة إلى ١٧ ذكرًا آخر من مجموعة حصن المسلم المعروفة — طالع <a href=\"https://github.com/shamsbd71/zikr/blob/main/Sources/ZikrReminder/Models/ZikrList.swift\">القائمة الكاملة على GitHub</a>.",

      aboutTitle: "ما هو الذكر؟",
      aboutText: "الذكر هو الممارسة الإسلامية في تذكّر الله بعبارات قصيرة من التسبيح والحمد، تُقال بهدوء على مدار اليوم لا في الصلاة الرسمية فقط. يُدخل Zikr هذه العادة في إيقاع جهاز الماك اليومي: تذكير قصير ومسموع في لحظة غير متوقعة، ثم يبتعد من جديد.",

      faqTitle: "الأسئلة الشائعة",
      q0: "هل يتوجب عليّ فعل أي شيء؟", a0: "لا. خلافًا لتطبيقات متابعة العادات أو الأوراد، لا يطلب منك Zikr أبدًا فتحه أو النقر عليه أو العدّ. هو يتحدث من تلقاء نفسه؛ وأنت تستمع فقط.",
      qPlatform: "ما هي الأنظمة التي يدعمها Zikr؟", aPlatform: "macOS 14+ (إنتل وApple Silicon)، ومعظم توزيعات Linux الرئيسية — حزمة .deb لـ Debian/Ubuntu/Mint/Pop!_OS، ومثبّت محلي للمستخدم لبقية التوزيعات — Windows 10 و 11، وAndroid 8+ (نزّل ملف APK من GitHub Releases وثبّته مباشرة — لا يوجد بعد على متجر Play).",
      q1: "هل Zikr مجاني؟", a1: "نعم. Zikr مجاني ومفتوح المصدر برخصة MIT. لا حسابات ولا اشتراكات ولا مشتريات داخل التطبيق.",
      q2: "هل يحتاج Zikr إلى اتصال بالإنترنت؟", a2: "لا، بعد التثبيت يعمل بلا اتصال بالكامل. لا يتصل بالشبكة إلا إذا نقرت بنفسك على Check for Updates.",
      q3: "هل يشغّل Zikr الأذان أو يعرض مواقيت الصلاة؟", a3: "لا. صُمم Zikr عمدًا ليقوم بأمر واحد فقط: تذكيرات ذكر عشوائية. لا يتضمن أذانًا ولا مواقيت صلاة ولا قبلة ولا أي ميزة أخرى.",
      q4: "ما هي عبارات الذكر المضمّنة؟", a4: "مجموعة مختارة من الأذكار العامة لأي وقت من مجموعة حصن المسلم المعروفة، منها سبحان الله، الحمد لله، الله أكبر، لا إله إلا الله، أستغفر الله، وغيرها.",
      q5: "هل يجمع Zikr أي بيانات؟", a5: "التطبيق لا يجمع شيئًا — لا تحليلات ولا تتبّع ولا حسابات — وإعداداتك لا تغادر جهازك أبدًا. أمّا الموقع فمنفصل: يَعُدّ زيارات الصفحات بشكل مجهول عبر Cloudflare Web Analytics، بلا كوكيز وبلا ما يُعرّف بك.",
      q6: "يقول macOS إنه لا يمكن التحقق من المطوّر — هل هذا طبيعي؟", a6: "نعم. Zikr موقّع توقيعًا ذاتيًا (adhoc) إذ لا يوجد حساب Apple Developer مدفوع خلف مشروع شخصي، لذا يحتاج التشغيل الأول إلى تجاوز: انقر بزر الفأرة الأيمن على التطبيق ثم Open، أو اسمح به من System Settings → Privacy & Security. تفعل هذا مرة واحدة فقط.",

      footerText: "Zikr مجاني ومفتوح المصدر برخصة <a href=\"https://github.com/shamsbd71/zikr/blob/main/LICENSE\">MIT</a>. الشيفرة المصدرية والمشكلات والإصدارات على <a href=\"https://github.com/shamsbd71/zikr\">GitHub</a>. التسجيلات الصوتية من حصن المسلم، ينشرها موقع <a href=\"https://dua.gtaf.org/\">dua.gtaf.org</a>.",
      footerVersion: "الإصدار الحالي: <a href=\"https://github.com/shamsbd71/zikr/releases/tag/v1.9.0\">v1.9.0</a> (٢١ سبتمبر ٢٠٢٦) — macOS وLinux وWindows وAndroid. <a href=\"https://github.com/shamsbd71/zikr/blob/main/CHANGELOG.md\">سجل التغييرات الكامل</a>."
    }
  };

  var SUPPORTED = ["en", "bn", "ar"];

  /* The eight adhkar the site can speak. Arabic and transliteration are
     verbatim from data/zikr.json; `m` names the meaning string so it
     follows the page language, and `s` is the measured clip length. */
  var ZIKR = [
    { id: 1,  ar: "سُبْحَانَ اللَّهِ", tr: "SubhanAllah", m: "zm1", s: 1.4 },
    { id: 2,  ar: "الْحَمْدُ لِلَّهِ", tr: "Alhamdulillah", m: "zm2", s: 1.5 },
    { id: 3,  ar: "اللَّهُ أَكْبَرُ", tr: "Allahu Akbar", m: "zm3", s: 1.6 },
    { id: 22, ar: "بِسْمِ اللَّهِ", tr: "Bismillah", m: "zm22", s: 2.0 },
    { id: 5,  ar: "أَسْتَغْفِرُ اللَّهَ", tr: "Astaghfirullah", m: "zm5", s: 2.0 },
    { id: 7,  ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", tr: "SubhanAllahi wa bihamdihi", m: "zm7", s: 3.0 },
    { id: 6,  ar: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", tr: "La hawla wala quwwata illa billah", m: "zm6", s: 3.5 },
    { id: 26, ar: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغيثُ أَصْلِحْ لِي شَأْنِيَ كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",
      tr: "Ya Hayyu ya Qayyumu birahmatika astagheeth…", m: "zm26", s: 11.7, tag: "tagEvening" }
  ];

  /* The hero card rotates only the short adhkar. The long one is four
     times the height of "SubhanAllah", and cycling into it would shove
     the whole page down mid-read; it stays playable in the library
     below, where a tall row costs nothing. */
  var LIVE_SET = ZIKR.filter(function (z) { return z.s <= 4; });

  var lang = "en";
  var audio = new Audio();
  var playingId = null;
  var liveIndex = 0;
  var cycleTimer = null;
  var CYCLE_MS = 7000;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function t(key) {
    var dict = STRINGS[lang] || STRINGS.en;
    return dict[key] != null ? dict[key] : (STRINGS.en[key] || "");
  }

  /* ---------------- theme ---------------- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.querySelectorAll("[data-theme-set]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-set") === theme));
    });
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "light" ? "#F7EFDC" : "#0A0F0D");
    try { localStorage.setItem("zikrTheme", theme); } catch (e) {}
  }

  function initialTheme() {
    try {
      var saved = localStorage.getItem("zikrTheme");
      if (saved === "light" || saved === "dark") return saved;
    } catch (e) {}
    // Dark is this page's home key; only an explicit light preference
    // moves it.
    return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }

  /* ---------------- audio ---------------- */
  function stopAudio() {
    audio.pause();
    audio.currentTime = 0;
    var was = playingId;
    playingId = null;
    if (was != null) paintPlayState();
  }

  function play(z) {
    if (playingId === z.id) { stopAudio(); return; }
    stopAudio();
    audio.src = "audio/" + z.id + ".mp3";
    playingId = z.id;
    paintPlayState();
    audio.play().catch(function () {
      // Autoplay policy or a missing file - fail back to silence rather
      // than leaving a button stuck mid-state.
      playingId = null;
      paintPlayState();
    });
  }

  function paintPlayState() {
    var live = LIVE_SET[liveIndex];
    var btn = document.getElementById("live-play");
    var on = playingId != null && live && playingId === live.id;
    btn.setAttribute("data-playing", String(on));
    btn.querySelector(".ico-play").hidden = on;
    btn.querySelector(".ico-stop").hidden = !on;
    document.getElementById("live-play-label").textContent = on ? t("heroPlaying") : t("heroHear");

    document.querySelectorAll(".zikr-row").forEach(function (row) {
      var on2 = String(playingId) === row.getAttribute("data-id");
      row.setAttribute("data-playing", String(on2));
      var b = row.querySelector(".row-play");
      b.querySelector(".ico-play").hidden = on2;
      b.querySelector(".ico-stop").hidden = !on2;
      b.setAttribute("aria-label", (on2 ? t("stopLabel") : t("playLabel")) + " — " + b.getAttribute("data-translit"));
    });
  }

  audio.addEventListener("ended", function () { playingId = null; paintPlayState(); });
  audio.addEventListener("timeupdate", function () {
    var bar = document.getElementById("live-bar");
    var live = LIVE_SET[liveIndex];
    if (!bar || !live || playingId !== live.id || !audio.duration) return;
    bar.style.width = (audio.currentTime / audio.duration * 100) + "%";
  });

  /* ---------------- the live card ---------------- */
  function paintLive(animate) {
    var z = LIVE_SET[liveIndex];
    document.getElementById("live-arabic").textContent = z.ar;
    document.getElementById("live-translit").textContent = z.tr;
    document.getElementById("live-meaning").textContent = t(z.m);
    document.getElementById("live-bar").style.width = "0%";
    if (animate && !reduceMotion) {
      var box = document.getElementById("live-text");
      box.querySelectorAll("*").forEach(function (el) {
        el.style.animation = "none";
        void el.offsetWidth;          // restart the entrance
        el.style.animation = "";
      });
    }
    paintPlayState();
  }

  function advance() {
    // Never cut a recitation short to change cards.
    if (playingId != null) return;
    liveIndex = (liveIndex + 1) % LIVE_SET.length;
    paintLive(true);
  }

  function startCycle() {
    if (cycleTimer) clearInterval(cycleTimer);
    cycleTimer = setInterval(advance, CYCLE_MS);
  }

  /* ---------------- the library ---------------- */
  function renderRows() {
    var host = document.getElementById("zikr-list-rows");
    host.innerHTML = "";
    ZIKR.forEach(function (z) {
      var row = document.createElement("div");
      row.className = "zikr-row";
      row.setAttribute("data-id", String(z.id));
      row.setAttribute("data-playing", "false");

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "row-play";
      btn.setAttribute("data-translit", z.tr);
      btn.innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico-play"><path fill="currentColor" d="M8 5.4v13.2c0 .8.9 1.3 1.6.9l10.2-6.6c.6-.4.6-1.4 0-1.8L9.6 4.5c-.7-.4-1.6.1-1.6.9z"/></svg>' +
        '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico-stop" hidden><rect x="6" y="5.5" width="4.2" height="13" rx="1.2" fill="currentColor"/><rect x="13.8" y="5.5" width="4.2" height="13" rx="1.2" fill="currentColor"/></svg>';
      btn.addEventListener("click", function () { play(z); });

      var text = document.createElement("div");
      text.className = "row-text";
      var ar = document.createElement("div");
      ar.className = "row-arabic"; ar.textContent = z.ar;
      var tr = document.createElement("div");
      tr.className = "row-translit"; tr.textContent = z.tr;
      var me = document.createElement("div");
      me.className = "row-meaning"; me.setAttribute("data-meaning-key", z.m); me.textContent = t(z.m);
      text.appendChild(ar); text.appendChild(tr); text.appendChild(me);

      var meta = document.createElement("div");
      meta.className = "row-meta";
      if (z.tag) {
        var tag = document.createElement("span");
        tag.className = "row-tag"; tag.setAttribute("data-tag-key", z.tag); tag.textContent = t(z.tag);
        meta.appendChild(tag);
      }
      var dur = document.createElement("span");
      dur.className = "row-dur"; dur.textContent = z.s.toFixed(1) + "s";
      meta.appendChild(dur);

      row.appendChild(btn); row.appendChild(text); row.appendChild(meta);
      host.appendChild(row);
    });
    paintPlayState();
  }

  /* ---------------- language ---------------- */
  function detectPlatform() {
    var ua = (navigator.userAgent || "") + " " + (navigator.platform || "");
    if (/Android/i.test(ua)) return "android";
    if (/Mac|iPhone|iPad/i.test(ua)) return "mac";
    if (/Linux/i.test(ua)) return "linux";
    if (/Win/i.test(ua)) return "windows";
    return "generic";
  }

  function detectDefault() {
    try {
      var saved = localStorage.getItem("zikrLang");
      if (saved && SUPPORTED.indexOf(saved) !== -1) return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return SUPPORTED.indexOf(nav) !== -1 ? nav : "en";
  }

  function applyLang(next) {
    lang = SUPPORTED.indexOf(next) !== -1 ? next : "en";
    var dict = STRINGS[lang] || STRINGS.en;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (dict[key] != null) el.textContent = dict[key];
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-html");
      if (dict[key] != null) el.innerHTML = dict[key];
    });
    document.querySelectorAll(".lang-switch button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });

    var ctaKey = { mac: "ctaDownloadMac", linux: "ctaDownloadLinux", windows: "ctaDownloadWindows", android: "ctaDownloadAndroid" }[detectPlatform()] || "ctaDownloadGeneric";
    var ctaEl = document.getElementById("cta-download");
    if (ctaEl && dict[ctaKey] != null) ctaEl.textContent = dict[ctaKey];

    // Content rendered from JS carries its own key, so it re-reads here
    // rather than going stale in the previous language.
    document.querySelectorAll("[data-meaning-key]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-meaning-key"));
    });
    document.querySelectorAll("[data-tag-key]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-tag-key"));
    });
    paintLive(false);

    try { localStorage.setItem("zikrLang", lang); } catch (e) {}
  }

  /* ---------------- wire up ---------------- */
  applyTheme(initialTheme());
  document.querySelectorAll("[data-theme-set]").forEach(function (b) {
    b.addEventListener("click", function () { applyTheme(b.getAttribute("data-theme-set")); });
  });

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () { applyLang(btn.getAttribute("data-lang")); });
  });

  document.getElementById("live-play").addEventListener("click", function () {
    play(LIVE_SET[liveIndex]);
  });

  renderRows();
  applyLang(detectDefault());
  paintLive(false);
  if (!reduceMotion) startCycle();
})();
</script>
</body>
</html>
