<style>
  :root {
    --parchment: #F7EFDC;
    --parchment-panel: #FCF7EB;
    --ink: #29231D;
    --ink-dim: #6B6053;
    --emerald: #0E6B52;
    --emerald-deep: #093D30;
    --emerald-bright: #16855F;
    --gold: #B8892E;
    --gold-bright: #E4B94F;
    --terracotta: #B7472A;
    --lapis: #2A5C8A;
    --border: rgba(41, 35, 29, 0.12);
    --border-on-emerald: rgba(228, 185, 79, 0.35);

    --font-en: "Noto Serif", Georgia, "Times New Roman", serif;
    --font-bn: "Noto Serif Bengali", "Noto Serif", serif;
    --font-ar: "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", serif;
    --font-body: var(--font-en);
  }

  html[lang="bn"] { --font-body: var(--font-bn); }
  html[lang="ar"] { --font-body: var(--font-ar); }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--parchment);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--emerald); transition: color 0.15s ease; }
  a:hover { color: var(--terracotta); }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }

  /* ---- top nav ---- */
  .topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    max-width: 980px;
    margin: 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    color: var(--emerald-deep);
  }
  .brand img { width: 28px; height: 28px; }

  .lang-switch {
    display: flex;
    gap: 4px;
    background: var(--parchment-panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }
  .lang-switch button {
    appearance: none;
    border: none;
    background: transparent;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .lang-switch button.active {
    background: var(--emerald);
    color: #fff;
  }

  /* ---- hero ---- */
  header.hero {
    position: relative;
    overflow: hidden;
    padding: 68px 0 76px;
    background:
      linear-gradient(160deg, var(--emerald-bright) 0%, var(--emerald) 45%, var(--emerald-deep) 100%);
    color: #fff;
  }
  header.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg, rgba(228,185,79,0.10) 25%, transparent 25%, transparent 75%, rgba(228,185,79,0.10) 75%),
      linear-gradient(45deg, rgba(228,185,79,0.10) 25%, transparent 25%, transparent 75%, rgba(228,185,79,0.10) 75%);
    background-position: 0 0, 22px 22px;
    background-size: 44px 44px;
    pointer-events: none;
  }
  .hero-inner { position: relative; display: flex; align-items: center; gap: 44px; }
  .crescent { flex: 0 0 auto; width: 132px; height: 132px; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25)); }

  .eyebrow {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--gold-bright);
    margin: 0 0 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .hero-copy h1 {
    font-size: 42px;
    line-height: 1.18;
    margin: 0 0 16px;
    font-weight: 600;
    max-width: 15ch;
  }
  html[lang="ar"] .hero-copy h1 { max-width: none; }

  .hero-copy p.tagline {
    font-size: 18px;
    color: rgba(255,255,255,0.86);
    margin: 0 0 30px;
    max-width: 52ch;
  }

  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; }

  .platform-badges {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    margin: 20px 0 0;
  }
  .platform-badges-label {
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.58);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin-inline-end: 2px;
  }
  .platform-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px 7px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border-on-emerald);
    color: rgba(255,255,255,0.92);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .platform-badge svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--gold-bright); }
  .platform-badge:hover {
    background: rgba(228,185,79,0.16);
    border-color: var(--gold-bright);
    color: #fff;
    transform: translateY(-1px);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 22px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    border: 1px solid transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1a1305; }
  .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; border-color: var(--border-on-emerald); }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary:hover { box-shadow: 0 10px 22px rgba(0,0,0,0.28); }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.4); }

  /* ---- signature: passive vs active ---- */
  section.signature { padding: 60px 0; }
  .signature-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .sig-col { padding: 32px 30px; }
  .sig-col.no {
    background: var(--parchment-panel);
    border-inline-end: 1px solid var(--border);
  }
  .sig-col.yes {
    background: linear-gradient(160deg, var(--emerald-bright), var(--emerald));
    color: #fff;
  }
  .sig-col h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    margin: 0 0 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .sig-col.no h3 { color: var(--terracotta); }
  .sig-col.yes h3 { color: var(--gold-bright); }

  .sig-col.no ul { list-style: none; margin: 0; padding: 0; }
  .sig-col.no li {
    padding: 9px 0;
    border-bottom: 1px dashed var(--border);
    color: var(--ink-dim);
    text-decoration: line-through;
    text-decoration-color: var(--terracotta);
    text-decoration-thickness: 1.5px;
  }
  .sig-col.no li:last-child { border-bottom: none; }

  .sig-col.yes p { font-size: 22px; font-weight: 600; margin: 0; line-height: 1.5; }

  /* ---- generic sections ---- */
  section { padding: 56px 0; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }

  h2.section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gold);
    margin: 0 0 30px;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .feature h3 { font-size: 17px; margin: 0 0 8px; color: var(--emerald-deep); }
  .feature p { margin: 0; color: var(--ink-dim); font-size: 14.5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .step .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--emerald); color: #fff; font-weight: 700; font-size: 14px;
    margin-bottom: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .step h3 { font-size: 16px; margin: 0 0 6px; color: var(--emerald-deep); }
  .step p { margin: 0; color: var(--ink-dim); font-size: 14.5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  .zikr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .zikr-card {
    background: var(--parchment-panel);
    border: 1px solid var(--border);
    border-inline-start: 3px solid var(--gold);
    border-radius: 10px;
    padding: 18px 20px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .zikr-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(41,35,29,0.10);
  }
  .zikr-card .arabic {
    font-family: var(--font-ar);
    font-size: 25px;
    color: var(--emerald-deep);
    direction: rtl;
    margin-bottom: 6px;
  }
  .zikr-card .translit { font-weight: 700; font-size: 14.5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .zikr-card .meaning { color: var(--ink-dim); font-size: 13px; margin-top: 2px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .zikr-note { color: var(--ink-dim); font-size: 14.5px; margin-top: 18px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  .about p { color: var(--ink-dim); max-width: 68ch; font-size: 16px; }

  details { border-bottom: 1px solid var(--border); padding: 18px 0; }
  details:first-of-type { border-top: 1px solid var(--border); }
  summary {
    cursor: pointer; font-weight: 700; font-size: 15.5px; list-style: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--emerald-deep);
    transition: color 0.15s ease;
  }
  summary:hover { color: var(--terracotta); }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+ "; color: var(--terracotta); font-weight: 700; }
  details[open] summary::before { content: "\2212 "; }
  details p { color: var(--ink-dim); margin: 12px 0 0; font-size: 14.5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  footer { padding: 36px 0 56px; color: var(--ink-dim); font-size: 13.5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  footer a { color: var(--ink-dim); text-decoration: underline; }
  .footer-version { margin: 8px 0 0; opacity: 0.72; }

  :focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; }

  @media (max-width: 720px) {
    .hero-inner { flex-direction: column; align-items: flex-start; gap: 24px; }
    .hero-copy h1 { font-size: 30px; max-width: none; }
    .features, .steps, .zikr-grid { grid-template-columns: 1fr; }
    .signature-grid { grid-template-columns: 1fr; }
    .sig-col.no { border-inline-end: none; border-bottom: 1px solid var(--border); }
    .topnav { flex-direction: column; gap: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>

  var SUPPORTED = ["en", "bn", "ar"];

  function detectPlatform() {
    var ua = (navigator.userAgent || "") + " " + (navigator.platform || "");
    if (/Win/i.test(ua)) return "windows";
    if (/Mac|iPhone|iPad|iPod/i.test(ua)) return "mac";
    if (/Linux|X11/i.test(ua) && !/Android/i.test(ua)) return "linux";
    return "other";
  }

  function detectDefault() {
    try {
      var saved = localStorage.getItem("zikrLang");
      if (saved && SUPPORTED.indexOf(saved) !== -1) return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return SUPPORTED.indexOf(nav) !== -1 ? nav : "en";
  }

  function applyLang(lang) {
    var dict = STRINGS[lang] || STRINGS.en;
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (dict[key] != null) el.textContent = dict[key];
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-html");
      if (dict[key] != null) el.innerHTML = dict[key];
    });
    document.querySelectorAll(".lang-switch button").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });

    var ctaKey = { mac: "ctaDownloadMac", linux: "ctaDownloadLinux", windows: "ctaDownloadWindows" }[detectPlatform()] || "ctaDownloadGeneric";
    var ctaEl = document.getElementById("cta-download");
    if (ctaEl && dict[ctaKey] != null) ctaEl.textContent = dict[ctaKey];

    try { localStorage.setItem("zikrLang", lang); } catch (e) {}
  }

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      applyLang(btn.getAttribute("data-lang"));
    });
  });

  applyLang(detectDefault());
})();
