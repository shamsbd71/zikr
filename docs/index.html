<style>
  /* ------------------------------------------------------------------
     A quiet catalogue page. Morning-mist sage in the light theme, dusk
     teal in the dark one. See DESIGN.md before changing a colour.
     ------------------------------------------------------------------ */
  :root {
    --bg:            #F2F6F3;
    --bg-deep:       #E6EEEA;
    --panel:         #FAFCFA;
    --panel-raised:  #FFFFFF;
    --ink:           #22322E;
    --ink-dim:       #52645E;
    --accent:        #2C6E63;
    --accent-strong: #235A51;
    --tint:          #DDEBE6;
    --sand:          #7A6840;
    --on-accent:     #F7FBF8;
    --hairline:      rgba(44, 110, 99, 0.22);
    --hairline-soft: rgba(34, 50, 46, 0.10);
    --shadow:        0 16px 40px -24px rgba(34, 60, 54, 0.35);
    --hero-from:     #DFECEE;

    --font-en: "Noto Serif", Georgia, serif;
    --font-bn: "Noto Serif Bengali", "Noto Serif", serif;
    --font-ar: "Noto Naskh Arabic", "Noto Serif", serif;
    --font-body: var(--font-en);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: light;
  }

  html[data-theme="dark"] {
    --bg:            #151F1F;
    --bg-deep:       #0F1818;
    --panel:         #1C2929;
    --panel-raised:  #233232;
    --ink:           #E4ECE7;
    --ink-dim:       #A2B3AC;
    --accent:        #8FCABB;
    --accent-strong: #A9DACD;
    --tint:          #27403C;
    --sand:          #CFBC90;
    --on-accent:     #12201D;
    --hairline:      rgba(143, 202, 187, 0.24);
    --hairline-soft: rgba(228, 236, 231, 0.10);
    --shadow:        0 16px 40px -24px rgba(0, 0, 0, 0.8);
    --hero-from:     #1B2C2E;
    color-scheme: dark;
  }

  html[lang="bn"] { --font-body: var(--font-bn); }
  html[lang="ar"] { --font-body: var(--font-ar); }

  * { box-sizing: border-box; }

  /* Flex containers blockify their children, which outranks the UA rule
     for [hidden] and left both play and stop icons visible at once. */
  [hidden] { display: none !important; }

  html { scroll-behavior: smooth; overflow-x: hidden; }
  body { overflow-x: clip; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    transition: background 0.5s var(--ease), color 0.5s var(--ease);
  }

  /* Browser surfaces belong to the design too. */
  ::selection { background: var(--accent); color: var(--on-accent); }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }
  * { scrollbar-color: var(--accent) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb {
    background: var(--hairline);
    border: 3px solid var(--bg-deep);
    border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .wrap { width: min(1040px, 100% - 48px); margin-inline: auto; }

  /* Prose links only: a bare `a` rule would outrank the buttons' colour. */
  a:not(.btn) { color: var(--accent); text-underline-offset: 2px; }
  a:not(.btn):hover { color: var(--accent-strong); }

  /* ---------------- nav ---------------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid var(--hairline-soft);
  }
  .topnav { display: flex; align-items: center; gap: 16px; padding: 14px 0; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-ui); font-weight: 700;
    letter-spacing: -0.02em; font-size: 17px;
    margin-inline-end: auto;
  }
  .brand img { border-radius: 7px; }

  .lang-switch, .theme-switch {
    display: flex; align-items: center;
    border: 1px solid var(--hairline); border-radius: 99px;
    padding: 3px; gap: 2px;
  }
  .lang-switch button, .theme-switch button {
    font-family: var(--font-ui); font-size: 12.5px; font-weight: 600;
    color: var(--ink-dim); background: none; border: 0;
    padding: 6px 12px; border-radius: 99px; cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .lang-switch button:hover, .theme-switch button:hover { color: var(--ink); }
  .lang-switch button[aria-pressed="true"],
  .theme-switch button[aria-pressed="true"] {
    background: var(--tint); color: var(--accent-strong);
  }
  .theme-switch button { display: grid; place-items: center; padding: 6px 10px; }
  .theme-switch svg { width: 15px; height: 15px; display: block; }

  /* ---------------- header ---------------- */
  .hero {
    padding: 64px 0 72px;
    background: linear-gradient(180deg, var(--hero-from), var(--bg));
  }
  .hero-inner {
    display: grid; gap: 56px;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    align-items: center;
  }
  .hero h1 {
    font-size: clamp(2rem, 4.4vw, 3rem);
    font-weight: 600;
    line-height: 1.18; letter-spacing: -0.025em;
    margin: 0 0 18px; text-wrap: balance;
  }
  html[lang="ar"] .hero h1, html[lang="ar"] .section-title { letter-spacing: 0; line-height: 1.4; }
  .hero .tagline { font-size: 1.08rem; color: var(--ink-dim); margin: 0 0 28px; max-width: 46ch; }

  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-ui); font-weight: 600; font-size: 15px;
    padding: 12px 22px; border-radius: 99px; text-decoration: none;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-secondary { color: var(--accent-strong); border: 1px solid var(--hairline); }
  .btn-secondary:hover { background: var(--tint); }
  .hero-meta { font-family: var(--font-ui); font-size: 13.5px; color: var(--ink-dim); margin: 0; }

  /* ---------------- the live card: the page performs the product ------- */
  .live {
    position: relative;
    background: var(--panel-raised);
    border: 1px solid var(--hairline-soft);
    border-radius: 20px;
    padding: 34px 32px 26px;
    box-shadow: var(--shadow);
    text-align: center;
    min-height: 300px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .live-status {
    position: absolute; top: 16px; inset-inline-start: 20px;
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-ui); font-size: 12px; font-weight: 600;
    color: var(--ink-dim);
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: live-pulse 3.2s ease-in-out infinite;
  }
  @keyframes live-pulse { 50% { opacity: 0.35; } }

  .live-arabic {
    font-family: var(--font-ar);
    font-size: clamp(1.9rem, 4.2vw, 2.7rem);
    line-height: 1.85; color: var(--accent-strong);
    margin: 10px 0 14px; direction: rtl; unicode-bidi: isolate;
  }
  .live-translit {
    font-family: var(--font-ui); font-size: 14px; font-weight: 600;
    letter-spacing: 0.02em; margin-bottom: 6px;
  }
  .live-meaning { font-size: 0.97rem; color: var(--ink-dim); margin: 0 auto; max-width: 34ch; }

  /* The authored moment: each dhikr arrives out of soft focus. */
  .live-text > * { animation: dhikr-in 0.9s var(--ease) both; }
  .live-text > *:nth-child(2) { animation-delay: 0.07s; }
  .live-text > *:nth-child(3) { animation-delay: 0.13s; }
  @keyframes dhikr-in {
    from { opacity: 0; transform: translateY(9px); filter: blur(7px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }

  .live-controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 26px; }
  .play-btn {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--font-ui); font-size: 14px; font-weight: 600;
    padding: 10px 20px 10px 16px; border-radius: 99px; cursor: pointer;
    background: var(--tint); color: var(--accent-strong); border: 0;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .play-btn:hover, .play-btn[data-playing="true"] { background: var(--accent); color: var(--on-accent); }
  .play-btn svg { width: 15px; height: 15px; flex: none; }

  .live-progress { height: 2px; margin-top: 20px; border-radius: 99px; background: var(--hairline-soft); overflow: hidden; }
  .live-progress span { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.25s linear; }

  /* ---------------- sections ---------------- */
  main { padding: 40px 0 24px; }
  section { margin-bottom: 84px; }
  .section-title {
    font-size: clamp(1.45rem, 2.8vw, 1.9rem); font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.25;
    margin: 0 0 22px; text-wrap: balance;
  }
  .section-lede { color: var(--ink-dim); max-width: 64ch; margin: -10px 0 28px; }

  /* the story: the one section allowed to run long */
  .story { max-width: 66ch; }
  .story p { margin: 0 0 18px; font-size: 1.08rem; }
  .maker {
    margin: 32px 0 0; padding: 24px 26px;
    background: var(--tint); border-radius: 16px;
  }
  .maker p { margin: 0 0 10px; }
  .maker cite { font-family: var(--font-ui); font-size: 13.5px; font-style: normal; color: var(--ink-dim); }

  /* catalogue tables: spec sheet, options, downloads */
  .spec { width: 100%; border-collapse: collapse; }
  .spec th, .spec td {
    text-align: start; vertical-align: top;
    padding: 14px 20px 14px 0;
    border-top: 1px solid var(--hairline-soft);
  }
  html[dir="rtl"] .spec th, html[dir="rtl"] .spec td { padding: 14px 0 14px 20px; }
  .spec thead th {
    border-top: 0; padding-top: 0;
    font-family: var(--font-ui); font-size: 12.5px; font-weight: 600; color: var(--ink-dim);
  }
  .spec tbody th { font-size: 1rem; font-weight: 600; width: 27%; }
  .spec td { color: var(--ink-dim); font-size: 0.96rem; }
  .spec .where, .spec .file { font-family: var(--font-ui); font-size: 13.5px; }
  .spec .os { display: flex; align-items: center; gap: 9px; }
  .spec .os svg { width: 16px; height: 16px; flex: none; color: var(--accent); }

  /* ---------------- the library ---------------- */
  .zikr-list { display: grid; gap: 8px; }
  .zikr-row {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 18px;
    background: var(--panel); border-radius: 14px;
    padding: 14px 20px;
    transition: background 0.2s ease;
  }
  .zikr-row:hover { background: var(--panel-raised); }
  .zikr-row[data-playing="true"] { background: var(--panel-raised); box-shadow: inset 0 0 0 1px var(--accent); }
  .row-play {
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: var(--tint); color: var(--accent-strong); border: 0;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .row-play:hover { background: var(--accent); color: var(--on-accent); }
  .row-play svg { width: 14px; height: 14px; }
  .row-text { min-width: 0; }
  .row-arabic {
    font-family: var(--font-ar); font-size: 1.32rem; line-height: 1.9;
    color: var(--accent-strong);
    /* The script runs right-to-left, but the line still has to sit on
       the same edge as the transliteration under it, or the two read as
       unrelated. `start` would resolve to the right inside an rtl box. */
    direction: rtl; unicode-bidi: isolate; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  html[dir="rtl"] .row-arabic { text-align: right; }
  .row-translit {
    font-family: var(--font-ui); font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-meaning { font-size: 0.9rem; color: var(--ink-dim); margin-top: 2px; }
  .row-meta { display: flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 12px; color: var(--ink-dim); }
  .row-tag { font-size: 11.5px; font-weight: 600; color: var(--sand); border: 1px solid var(--hairline); border-radius: 99px; padding: 2px 9px; }
  .row-dur { font-variant-numeric: tabular-nums; }
  .zikr-note { color: var(--ink-dim); font-size: 0.92rem; margin-top: 20px; max-width: 70ch; }

  footer {
    padding: 36px 0 56px; color: var(--ink-dim); font-size: 13.5px;
    font-family: var(--font-ui);
    border-top: 1px solid var(--hairline-soft);
  }
  footer a:not(.btn) { color: var(--ink-dim); }
  .footer-version { margin: 8px 0 0; }

  /* ---------------- FAQ ---------------- */
  #faq details { border-top: 1px solid var(--hairline-soft); padding: 4px 0; max-width: 74ch; }
  #faq details:last-of-type { border-bottom: 1px solid var(--hairline-soft); }
  #faq summary {
    cursor: pointer; list-style: none;
    padding: 16px 34px 16px 0;
    font-size: 1.02rem; position: relative;
    transition: color 0.15s ease;
  }
  html[dir="rtl"] #faq summary { padding: 16px 0 16px 34px; }
  #faq summary::-webkit-details-marker { display: none; }
  #faq summary::after {
    content: ""; position: absolute; inset-inline-end: 6px; top: 50%;
    width: 9px; height: 9px; margin-top: -6px;
    border-right: 1.8px solid var(--accent);
    border-bottom: 1.8px solid var(--accent);
    transform: rotate(45deg);
    transition: transform 0.25s var(--ease);
  }
  #faq details[open] summary::after { transform: rotate(-135deg); margin-top: -2px; }
  #faq summary:hover { color: var(--accent-strong); }
  #faq details p { margin: 0 0 18px; color: var(--ink-dim); font-size: 0.96rem; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------------- responsive ---------------- */
  @media (max-width: 900px) {
    .hero-inner { grid-template-columns: 1fr; gap: 40px; }
  }
  @media (max-width: 640px) {
    .wrap, .topnav { width: calc(100% - 32px); }
    .hero { padding: 40px 0 48px; }
    .live { padding: 40px 20px 22px; min-height: 0; }
    .zikr-row { grid-template-columns: auto 1fr; gap: 14px; }
    .row-meta { grid-column: 2; margin-top: 4px; }
    .topnav { gap: 10px; flex-wrap: wrap; }
    .brand { font-size: 16px; }
    .lang-switch button { padding: 6px 9px; font-size: 12px; }
    /* Tables become stacked entries; the header row is redundant then. */
    .spec, .spec tbody, .spec tr, .spec th, .spec td { display: block; width: auto; }
    .spec thead { display: none; }
    .spec tr { padding: 14px 0; border-top: 1px solid var(--hairline-soft); }
    .spec tbody th, .spec td,
    html[dir="rtl"] .spec tbody th, html[dir="rtl"] .spec td { border: 0; padding: 2px 0; width: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .live-dot { animation: none; }
    .live-text > * { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>

  (function () {
    try {
      var s = localStorage.getItem("zikrTheme");
      var t = (s === "light" || s === "dark") ? s
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);

      o3h: "طريقة العرض", o3p: "إشعار عادي، أو ومضة هادئة تملأ الشاشة ثم تتلاشى بعد مدة تختارها.",
      o4h: "الإيقاف أثناء المكالمات", o4p: "يتخطى التذكير حين يستخدم أي تطبيق الميكروفون، فلا يقاطع اجتماعاتك. يكون مفعّلًا في البداية.",
      o5h: "Quiet Hours", o5p: "فترة يومية تتوقف فيها التذكيرات، مثل ٢٢:٠٠ إلى ٠٦:٠٠. تكون معطّلة في البداية.",
      o6h: "التشغيل عند الدخول", o6p: "يبدأ Zikr حين تسجّل الدخول. يكون معطّلًا في البداية.",
      o7h: "البسملة", o7p: "يقول بسم الله حين تفتح قفل الشاشة. وعلى macOS يقولها أيضًا عند بدء التطبيق.",

      downloadsTitle: "التنزيلات",
      downloadsLede: "كل الملفات في <a href=\"https://github.com/shamsbd71/zikr/releases/latest\">أحدث إصدار على GitHub</a>. يخبرك Zikr حين يصدر إصدار جديد ويثبّته بنقرة واحدة.",
      colPlatform: "النظام", colFile: "الملف", colInstall: "طريقة التثبيت",
      dMacFile: ".zip، نحو ٦ ميغابايت", dMac: "فُك الضغط واسحب Zikr إلى Applications. يعمل على Intel وApple Silicon.",
      dLinuxFile: ".deb، نحو ٢ ميغابايت", dLinux: "لتوزيعات Debian وUbuntu وMint وPop!_OS. افتحه في مثبّت البرامج. وتستخدم التوزيعات الأخرى المثبّت المحلي للمستخدم.",
      dWinFile: "مثبّت .exe، نحو ١٤ ميغابايت", dWin: "لنظامي Windows 10 و11. شغّل المثبّت. يُثبَّت لمستخدمك فقط، فلا يحتاج إلى صلاحيات المسؤول.",
      dAndroidFile: ".apk، نحو ١٠ ميغابايت", dAndroid: "نزّل ملف APK وثبّته مباشرة. لا يوجد Zikr على متجر Play بعد.",

      faqTitle: "الأسئلة الشائعة",
      q0: "هل يتوجب عليّ فعل أي شيء؟", a0: "ثبّته واختر كم مرة يذكر. بعد ذلك يعمل وحده، ولا تحتاج إلى فتحه.",
      qCount: "هل يعدّ أذكاري؟", aCount: "لا. لا يحتفظ التطبيق بعدّ ولا سجل ولا سلسلة أيام. يذكر ثم يصمت.",
      qSleep: "هل يذكر وحاسوبي في وضع السكون؟", aSleep: "يجب أن يكون حاسوب Mac أو Linux أو Windows مستيقظًا. وعلى Android يستمر والشاشة مطفأة، بعد أن تسمح له بالعمل في الخلفية.",
      q1: "هل Zikr مجاني؟", a1: "نعم. Zikr مجاني ومفتوح المصدر برخصة MIT. لا حسابات فيه ولا اشتراكات ولا مشتريات داخل التطبيق.",
      q2: "هل يحتاج Zikr إلى اتصال بالإنترنت؟", a2: "تعمل التذكيرات بلا اتصال، لأن التسجيلات داخل التطبيق. يتصل Zikr بـ GitHub للبحث عن إصدار جديد عند بدء تشغيله ثم مرة في اليوم، ولتنزيل التحديث، ولعرض What's New.",
      q3: "هل يشغّل Zikr الأذان أو يعرض مواقيت الصلاة؟", a3: "لا. يقوم Zikr بأمر واحد، وهو تذكيرات الذكر. لا أذان فيه ولا مواقيت صلاة ولا قبلة.",
      q4: "ما هي عبارات الذكر المضمّنة؟", a4: "٤٩ ذكرًا من حصن المسلم، منها سبحان الله والحمد لله والله أكبر ولا إله إلا الله وأستغفر الله، إضافة إلى أذكار الصباح والمساء والنوم.",
      q5: "هل يجمع Zikr أي بيانات؟", a5: "التطبيق لا يجمع شيئًا: لا تحليلات فيه ولا تتبّع ولا حسابات، وتبقى إعداداتك على جهازك. أمّا الموقع فمنفصل. يَعُدّ زيارات الصفحات بشكل مجهول عبر Cloudflare Web Analytics، بلا كوكيز وبلا ما يُعرّف بك.",
      q6: "يقول macOS إنه لا يمكن التحقق من المطوّر. هل هذا طبيعي؟", a6: "نعم. Zikr موقّع توقيعًا ذاتيًا (ad-hoc)، إذ لا يوجد حساب Apple Developer مدفوع لهذا المشروع الشخصي. يحتاج التشغيل الأول إلى تجاوز: انقر بزر الفأرة الأيمن على التطبيق واختر Open، أو اسمح به من System Settings ثم Privacy & Security. تفعل هذا مرة واحدة فقط.",

      footerText: "Zikr مجاني ومفتوح المصدر برخصة <a href=\"https://github.com/shamsbd71/zikr/blob/main/LICENSE\">MIT</a>. الشيفرة المصدرية والمشكلات والإصدارات على <a href=\"https://github.com/shamsbd71/zikr\">GitHub</a>. التسجيلات الصوتية من حصن المسلم، ينشرها موقع <a href=\"https://dua.gtaf.org/\">dua.gtaf.org</a>.",
      footerVersion: "الإصدار الحالي: <a href=\"https://github.com/shamsbd71/zikr/releases/tag/v1.11.0\">v1.11.0</a> (١ نوفمبر ٢٠٢٦) — macOS وLinux وWindows وAndroid. <a href=\"https://github.com/shamsbd71/zikr/blob/main/CHANGELOG.md\">سجل التغييرات الكامل</a>."
    }
  };

  var SUPPORTED = ["en", "bn", "ar"];

  /* The eight adhkar the site can speak. Arabic and transliteration are
     verbatim from data/zikr.json; `m` names the meaning string so it
     follows the page language, and `s` is the measured clip length. */
  var ZIKR = [
    { id: 1,  ar: "سُبْحَانَ اللَّهِ", tr: "SubhanAllah", m: "zm1", s: 1.4 },
    { id: 2,  ar: "الْحَمْدُ لِلَّهِ", tr: "Alhamdulillah", m: "zm2", s: 1.5 },
    { id: 3,  ar: "اللَّهُ أَكْبَرُ", tr: "Allahu Akbar", m: "zm3", s: 1.6 },
    { id: 22, ar: "بِسْمِ اللَّهِ", tr: "Bismillah", m: "zm22", s: 2.0 },
    { id: 5,  ar: "أَسْتَغْفِرُ اللَّهَ", tr: "Astaghfirullah", m: "zm5", s: 2.0 },
    { id: 7,  ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", tr: "SubhanAllahi wa bihamdihi", m: "zm7", s: 3.0 },
    { id: 6,  ar: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", tr: "La hawla wala quwwata illa billah", m: "zm6", s: 3.5 },
    { id: 26, ar: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغيثُ أَصْلِحْ لِي شَأْنِيَ كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",
      tr: "Ya Hayyu ya Qayyumu birahmatika astagheeth…", m: "zm26", s: 11.7, tag: "tagEvening" }
  ];

  /* The hero card rotates only the short adhkar. The long one is four
     times the height of "SubhanAllah", and cycling into it would shove
     the whole page down mid-read; it stays playable in the library
     below, where a tall row costs nothing. */
  var LIVE_SET = ZIKR.filter(function (z) { return z.s <= 4; });

  var lang = "en";
  var audio = new Audio();
  var playingId = null;
  var liveIndex = 0;
  var cycleTimer = null;
  var CYCLE_MS = 7000;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function t(key) {
    var dict = STRINGS[lang] || STRINGS.en;
    return dict[key] != null ? dict[key] : (STRINGS.en[key] || "");
  }

  /* ---------------- theme ---------------- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.querySelectorAll("[data-theme-set]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-set") === theme));
    });
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "dark" ? "#151F1F" : "#F2F6F3");
    try { localStorage.setItem("zikrTheme", theme); } catch (e) {}
  }

  function initialTheme() {
    try {
      var saved = localStorage.getItem("zikrTheme");
      if (saved === "light" || saved === "dark") return saved;
    } catch (e) {}
    // Light is this page's home key; only an explicit dark preference
    // moves it.
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  /* ---------------- audio ---------------- */
  function stopAudio() {
    audio.pause();
    audio.currentTime = 0;
    var was = playingId;
    playingId = null;
    if (was != null) paintPlayState();
  }

  function play(z) {
    if (playingId === z.id) { stopAudio(); return; }
    stopAudio();
    audio.src = "audio/" + z.id + ".mp3";
    playingId = z.id;
    paintPlayState();
    audio.play().catch(function () {
      // Autoplay policy or a missing file - fail back to silence rather
      // than leaving a button stuck mid-state.
      playingId = null;
      paintPlayState();
    });
  }

  function paintPlayState() {
    var live = LIVE_SET[liveIndex];
    var btn = document.getElementById("live-play");
    var on = playingId != null && live && playingId === live.id;
    btn.setAttribute("data-playing", String(on));
    btn.querySelector(".ico-play").hidden = on;
    btn.querySelector(".ico-stop").hidden = !on;
    document.getElementById("live-play-label").textContent = on ? t("heroPlaying") : t("heroHear");

    document.querySelectorAll(".zikr-row").forEach(function (row) {
      var on2 = String(playingId) === row.getAttribute("data-id");
      row.setAttribute("data-playing", String(on2));
      var b = row.querySelector(".row-play");
      b.querySelector(".ico-play").hidden = on2;
      b.querySelector(".ico-stop").hidden = !on2;
      b.setAttribute("aria-label", (on2 ? t("stopLabel") : t("playLabel")) + " — " + b.getAttribute("data-translit"));
    });
  }

  audio.addEventListener("ended", function () { playingId = null; paintPlayState(); });
  audio.addEventListener("timeupdate", function () {
    var bar = document.getElementById("live-bar");
    var live = LIVE_SET[liveIndex];
    if (!bar || !live || playingId !== live.id || !audio.duration) return;
    bar.style.width = (audio.currentTime / audio.duration * 100) + "%";
  });

  /* ---------------- the live card ---------------- */
  function paintLive(animate) {
    var z = LIVE_SET[liveIndex];
    document.getElementById("live-arabic").textContent = z.ar;
    document.getElementById("live-translit").textContent = z.tr;
    document.getElementById("live-meaning").textContent = t(z.m);
    document.getElementById("live-bar").style.width = "0%";
    if (animate && !reduceMotion) {
      var box = document.getElementById("live-text");
      box.querySelectorAll("*").forEach(function (el) {
        el.style.animation = "none";
        void el.offsetWidth;          // restart the entrance
        el.style.animation = "";
      });
    }
    paintPlayState();
  }

  function advance() {
    // Never cut a recitation short to change cards.
    if (playingId != null) return;
    liveIndex = (liveIndex + 1) % LIVE_SET.length;
    paintLive(true);
  }

  function startCycle() {
    if (cycleTimer) clearInterval(cycleTimer);
    cycleTimer = setInterval(advance, CYCLE_MS);
  }

  /* ---------------- the library ---------------- */
  function renderRows() {
    var host = document.getElementById("zikr-list-rows");
    host.innerHTML = "";
    ZIKR.forEach(function (z) {
      var row = document.createElement("div");
      row.className = "zikr-row";
      row.setAttribute("data-id", String(z.id));
      row.setAttribute("data-playing", "false");

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "row-play";
      btn.setAttribute("data-translit", z.tr);
      btn.innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico-play"><path fill="currentColor" d="M8 5.4v13.2c0 .8.9 1.3 1.6.9l10.2-6.6c.6-.4.6-1.4 0-1.8L9.6 4.5c-.7-.4-1.6.1-1.6.9z"/></svg>' +
        '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico-stop" hidden><rect x="6" y="5.5" width="4.2" height="13" rx="1.2" fill="currentColor"/><rect x="13.8" y="5.5" width="4.2" height="13" rx="1.2" fill="currentColor"/></svg>';
      btn.addEventListener("click", function () { play(z); });

      var text = document.createElement("div");
      text.className = "row-text";
      var ar = document.createElement("div");
      ar.className = "row-arabic"; ar.textContent = z.ar;
      var tr = document.createElement("div");
      tr.className = "row-translit"; tr.textContent = z.tr;
      var me = document.createElement("div");
      me.className = "row-meaning"; me.setAttribute("data-meaning-key", z.m); me.textContent = t(z.m);
      text.appendChild(ar); text.appendChild(tr); text.appendChild(me);

      var meta = document.createElement("div");
      meta.className = "row-meta";
      if (z.tag) {
        var tag = document.createElement("span");
        tag.className = "row-tag"; tag.setAttribute("data-tag-key", z.tag); tag.textContent = t(z.tag);
        meta.appendChild(tag);
      }
      var dur = document.createElement("span");
      dur.className = "row-dur"; dur.textContent = z.s.toFixed(1) + "s";
      meta.appendChild(dur);

      row.appendChild(btn); row.appendChild(text); row.appendChild(meta);
      host.appendChild(row);
    });
    paintPlayState();
  }

  /* ---------------- language ---------------- */
  function detectPlatform() {
    var ua = (navigator.userAgent || "") + " " + (navigator.platform || "");
    if (/Android/i.test(ua)) return "android";
    if (/Mac|iPhone|iPad/i.test(ua)) return "mac";
    if (/Linux/i.test(ua)) return "linux";
    if (/Win/i.test(ua)) return "windows";
    return "generic";
  }

  function detectDefault() {
    try {
      var saved = localStorage.getItem("zikrLang");
      if (saved && SUPPORTED.indexOf(saved) !== -1) return saved;
    } catch (e) {}
    var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return SUPPORTED.indexOf(nav) !== -1 ? nav : "en";
  }

  function applyLang(next) {
    lang = SUPPORTED.indexOf(next) !== -1 ? next : "en";
    var dict = STRINGS[lang] || STRINGS.en;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (dict[key] != null) el.textContent = dict[key];
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-html");
      if (dict[key] != null) el.innerHTML = dict[key];
    });
    document.querySelectorAll(".lang-switch button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });

    var ctaKey = { mac: "ctaDownloadMac", linux: "ctaDownloadLinux", windows: "ctaDownloadWindows", android: "ctaDownloadAndroid" }[detectPlatform()] || "ctaDownloadGeneric";
    var ctaEl = document.getElementById("cta-download");
    if (ctaEl && dict[ctaKey] != null) ctaEl.textContent = dict[ctaKey];

    // Content rendered from JS carries its own key, so it re-reads here
    // rather than going stale in the previous language.
    document.querySelectorAll("[data-meaning-key]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-meaning-key"));
    });
    document.querySelectorAll("[data-tag-key]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-tag-key"));
    });
    paintLive(false);

    try { localStorage.setItem("zikrLang", lang); } catch (e) {}
  }

  /* ---------------- wire up ---------------- */
  applyTheme(initialTheme());
  document.querySelectorAll("[data-theme-set]").forEach(function (b) {
    b.addEventListener("click", function () { applyTheme(b.getAttribute("data-theme-set")); });
  });

  document.querySelectorAll(".lang-switch button").forEach(function (btn) {
    btn.addEventListener("click", function () { applyLang(btn.getAttribute("data-lang")); });
  });

  document.getElementById("live-play").addEventListener("click", function () {
    play(LIVE_SET[liveIndex]);
  });

  renderRows();
  applyLang(detectDefault());
  paintLive(false);
  if (!reduceMotion) startCycle();
})();
</script>
</body>
</html>
